[project]
name = "datawright-cli"
version = "0.1.2"  # keep equal to VERSION in src/00_core.py
description = "Lineage, impact reports and join paths compiled from your data repo's code, for AI agents and reviewers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clement" }]
keywords = ["data-engineering", "lineage", "dbt", "airflow", "sql", "ai-agents", "mcp", "agent-skills"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database", "Topic :: Software Development :: Quality Assurance"]
dependencies = ["sqlglot>=30", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/clementlemon02/datawright"
Issues = "https://github.com/clementlemon02/datawright/issues"

[project.scripts]
datawright = "datawright:main"
dw = "datawright:main"
datawright-cli = "datawright:main"  # so `uvx datawright-cli init` works

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skills/data-context/scripts/datawright.py", "skills/data-context/assets"]

[tool.hatch.build.targets.wheel.sources]
"skills/data-context/scripts" = ""
"skills/data-context/assets" = "datawright_kit/assets"

[tool.hatch.build.targets.sdist]
include = ["skills", "README.md", "LICENSE", "pyproject.toml", "docs/logo.svg", "docs/demo.svg"]
