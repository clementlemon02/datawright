# Data impact report on every pull request: which tables the change touches, what's downstream, recorded gotchas,
# SQL that stopped parsing, the ticket key. Save as .github/workflows/data-impact.yml.
name: data-impact
on: pull_request
permissions:
  contents: read
  pull-requests: write  # to post the report as a comment
jobs:
  data-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff needs the merge base
      - uses: astral-sh/setup-uv@v7
      - name: Build the data context and review the change
        shell: bash  # with pipefail, so --strict can fail the check through tee
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}  # for the ticket key
        run: |
          uv run --no-config .data-context/datawright.py build
          uv run --no-config .data-context/datawright.py review --base "origin/${{ github.base_ref }}" --strict | tee data-impact.md
      - name: Post the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -s data-impact.md && gh pr comment "${{ github.event.pull_request.number }}" --body-file data-impact.md || true
